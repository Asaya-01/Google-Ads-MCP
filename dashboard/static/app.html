<title>Asaya D2C Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky brand + tab bar; each tab is a vertical stack of sections,
   summary (tiles, period tables) before detail (charts, then dense tables). */
:root {
  /* Warm Ivory: a soft cream page, white cards, black text, brown headings.
     Brand brown stays the accent (tabs, buttons, links). Chart blue and sale
     orange are the brand hues stepped into the validated lightness band.
     Light is the default; dark is a toggle in the header, never automatic. */
  --bg: #fbf8f3;
  --surface: #ffffff;
  --ink: #1a1a1a;
  --ink-2: #5c5650;
  --muted: #8a837b;
  --line: #e8e1d8;
  --axis: #d4ccc2;
  --brand: #674130;         /* wordmark brown */
  --head: #674130;          /* headings */
  --accent: #674130;        /* tabs, links, focus */
  --accent-wash: #f1e8df;
  --series-1: #2c60ac;      /* Meta / BAU (product-label blue) */
  --series-2: #d96a1c;      /* Google / Sale (sale-tag orange) */
  --good: #1e6b34;
  --bad: #b8004c;           /* badge crimson */
  --warn: #8f5a00;
  --warn-bg: #fdf0dc;
  --warn-ink: #6b4300;
  --bad-bg: #fbe3ec;
  --good-bg: #e4f1e5;
  --font-display: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --radius: 12px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #17110e; --surface: #211915; --ink: #f6ece4; --ink-2: #d2c0b4; --muted: #a39084;
  --line: #3a2d26; --axis: #4b3c33; --brand: #e8c7b1; --head: #e8c7b1; --accent: #e0b99f; --accent-wash: #33261f;
  --series-1: #3987e5; --series-2: #dd6a2a; --good: #52c26a; --bad: #ff7aa8; --warn: #f0b74a;
  --warn-bg: #3a2c10; --warn-ink: #f4d58a; --bad-bg: #3e1626; --good-bg: #17301d;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; color: var(--head); }
h2 { font-size: 19px; font-weight: 600; letter-spacing: -0.005em; }
h3 { font-size: 14px; font-weight: 600; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-inner, main { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.015em; line-height: 1; color: var(--brand); }
.brand span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 auto; min-width: 0; }
nav.tabs a { text-decoration: none; color: var(--ink-2); padding: 6px 12px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
nav.tabs a[aria-current="page"] { background: var(--accent-wash); color: var(--accent); }
nav.tabs a:hover { color: var(--ink); }
.theme-toggle { font: inherit; font-size: 12px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.theme-toggle:hover { border-color: var(--accent); color: var(--ink); }
.meta-line { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 12px; flex-wrap: wrap; }

main { padding-block: 20px 48px; display: grid; gap: 20px; }
section.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; align-content: start; }
.section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.sub { color: var(--muted); font-size: 12px; }
.grid-2 { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); }

.status { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip.ok::before { content: "●"; color: var(--good); font-size: 9px; }
.chip.missing { background: var(--bad-bg); border-color: transparent; color: var(--bad); }
.chip.missing::before { content: "▲"; font-size: 9px; }
.chip.pending { background: var(--warn-bg); border-color: transparent; color: var(--warn-ink); }
.phase { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; }
.phase.sale { background: color-mix(in srgb, var(--series-2) 16%, transparent); color: var(--ink); }
.phase.bau { background: color-mix(in srgb, var(--series-1) 12%, transparent); color: var(--ink-2); }
.phase.mixed { background: linear-gradient(90deg, color-mix(in srgb, var(--series-1) 12%, transparent) 45%, color-mix(in srgb, var(--series-2) 16%, transparent) 55%); color: var(--ink); text-transform: none; letter-spacing: 0; }

.pulse { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; display: grid; gap: 10px; align-content: start; min-width: 0; font-variant-numeric: tabular-nums; }
.pcard .plabel { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.pcard .psub { font-size: 12px; color: var(--muted); line-height: 1.35; }
.pcard .hero { font-family: var(--font-body); font-size: clamp(38px, 5vw, 52px); font-weight: 700; line-height: 1; letter-spacing: -0.025em; }
.pcard .vs { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.pcard .pfoot { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; color: var(--muted); }
.pcard svg.spark { width: 100%; height: 44px; display: block; overflow: visible; }
.pcard.checkout { border-left: 6px solid var(--line); }
.pcard.checkout.ok { border-left-color: var(--good); }
.pcard.checkout.watch { border-left-color: var(--warn); }
.pcard.checkout.problem { border-left-color: var(--bad); }
.status-pill { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: clamp(30px, 4.4vw, 40px); line-height: 1.05; letter-spacing: -0.02em; }
.status-pill { --c: var(--muted); color: var(--c); }
.status-pill.ok { --c: var(--good); } .status-pill.watch { --c: var(--warn); } .status-pill.problem { --c: var(--bad); }
.status-pill .ico { display: inline-grid; place-items: center; width: 1.05em; height: 1.05em; border-radius: 50%; background: var(--c); flex: none; }
.status-pill .ico b { color: var(--surface); font-size: 0.6em; font-weight: 700; line-height: 1; }
.steps summary { cursor: pointer; font-size: 12px; color: var(--accent); font-weight: 600; }
.steps .steprow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 2px 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.steps .steprow:last-child { border-bottom: 0; }
.steps .steprow .sub { text-align: right; }

.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.tile .label { color: var(--ink-2); font-size: 12px; overflow-wrap: anywhere; }
.tile .value { font-family: var(--font-display); font-size: clamp(19px, 1.7vw, 24px); font-weight: 600; line-height: 1.15; white-space: nowrap; }
.tile .foot { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.na { color: var(--muted); font-size: 12px; }
.tile .na { font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; }
.up { color: var(--good); }
.down { color: var(--bad); }
.flat { color: var(--ink-2); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { position: sticky; top: 0; background: var(--surface); color: var(--ink-2); font-weight: 500; font-size: 12px; }
th:first-child, td:first-child, td.text, th.text { text-align: left; }
td.text { white-space: normal; overflow-wrap: anywhere; min-width: 180px; max-width: 360px; }
tbody tr:hover td { background: color-mix(in srgb, var(--accent-wash) 60%, transparent); }
tr.total td { font-weight: 600; border-top: 2px solid var(--axis); }
tr.delta td { font-weight: 600; }
tr.group td { background: var(--accent-wash); color: var(--ink-2); font-size: 12px; font-weight: 600; text-align: left; }
td .cell-na { color: var(--muted); cursor: help; border-bottom: 1px dotted var(--muted); }
.legend-note { font-size: 12px; color: var(--muted); }
.live-ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }

.chart-box { position: relative; height: 240px; }
.chart-legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); }
.chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 12px; border: 0; background: transparent; color: var(--ink-2); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent); font-weight: 600; }

.commentary { white-space: pre-wrap; line-height: 1.6; max-width: 80ch; }
.notes { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 12px; display: grid; gap: 4px; max-width: 110ch; }
.banner { border-radius: 8px; padding: 10px 12px; background: var(--warn-bg); color: var(--warn-ink); font-size: 13px; }
.signin { max-width: 420px; margin: 12vh auto; text-align: center; display: grid; gap: 14px; justify-items: center; }
.empty { color: var(--muted); padding: 24px 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/*__RETENTION_CSS__*/
/*__RANGE_CSS__*/
</style>
<script>try { if (localStorage.getItem("asaya-theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) { /* storage blocked: stay light */ }</script>

<header class="bar">
  <div class="bar-inner">
    <div class="brand"><h1>asaya</h1><span>D2C</span></div>
    <nav class="tabs" id="tabs" aria-label="Dashboard tabs"></nav>
    <div class="meta-line" id="meta-line"></div>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false"></button>
  </div>
</header>
<main id="main"><p class="empty">Loading the dashboard…</p></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
/*__RETENTION_ENGINE__*/
/*__RANGE_ENGINE__*/
</script>
<script>
(() => {
  "use strict";
  const embedded = window.__DASH__ || null;   // set by the preview build; absent on Cloud Run
  const state = { config: null, status: null, pages: {}, tab: null, charts: [], drill: "channel", d1View: "table" };
  const $main = document.getElementById("main");

  // ------------------------------------------------------------ formatting
  const inGroup = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 });
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function inrCompact(v) {
    const a = Math.abs(v);
    if (a >= 1e7) return "Rs " + (v / 1e7).toFixed(2) + " Cr";
    if (a >= 1e5) return "Rs " + (v / 1e5).toFixed(2) + " L";
    return "Rs " + inGroup.format(v);
  }
  function fmt(v, unit, compact) {
    if (v === null || v === undefined || Number.isNaN(v)) return null;
    switch (unit) {
      case "inr": return compact ? inrCompact(v) : "Rs " + inGroup.format(v);
      case "int": return inGroup.format(v);
      case "num": return inGroup.format(Math.round(v));
      case "pct": return (v * 100).toFixed(2) + "%";
      case "x": return v.toFixed(2) + "x";
      default: return String(v);
    }
  }
  const NEUTRAL_DELTA = new Set(["spend", "meta_spend", "google_spend", "perf_spend", "sessions", "awareness_sessions"]);
  function deltaHtml(d, key) {
    if (d === null || d === undefined) return '<span class="flat">–</span>';
    if (Math.abs(d) < 0.00005) d = 0;
    const pct = (d >= 0 ? "+" : "") + (d * 100).toFixed(2) + "%";
    const arrow = d > 0 ? "▲" : d < 0 ? "▼" : "";
    const cls = NEUTRAL_DELTA.has(key) || d === 0 ? "flat" : d > 0 ? "up" : "down";
    return `<span class="${cls}">${arrow} ${pct}</span>`;
  }
  function cell(v, unit, reason) {
    const s = fmt(v, unit);
    if (s !== null) return esc(s);
    return `<span class="cell-na" title="Data unavailable: ${esc(reason || "not available")}">n/a</span>`;
  }
  const dayLabel = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" });
  const phaseChip = (p, note) => !p ? ""
    : p === "mixed" ? `<span class="phase mixed" title="${esc(note || "A sale went live or ended on this day")}">${esc(note ? note.replace(/^sale /, "") : "Transition")}</span>`
    : `<span class="phase ${p}" ${note ? `title="${esc(note)}"` : ""}>${p === "sale" ? "Sale" : "BAU"}</span>`;

  // ------------------------------------------------------------ charts
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  function destroyCharts() { state.charts.forEach((c) => c.destroy()); state.charts = []; }
  function axisOpts(unit) {
    return {
      grid: { color: css("--line"), drawTicks: false },
      border: { color: css("--axis") },
      ticks: { color: css("--muted"), font: { family: css("--font-body"), size: 11 }, padding: 6,
        callback: (v) => unit === "inr" ? inrCompact(v).replace("Rs ", "") : unit === "pct" ? (v * 100).toFixed(1) + "%" : unit === "x" ? v.toFixed(1) + "x" : inGroup.format(v) },
    };
  }
  function baseChart(canvas, cfg, unit) {
    if (!window.Chart) { canvas.parentElement.innerHTML = '<p class="na">Charts could not load. The tables below carry the same numbers.</p>'; return; }
    const chart = new Chart(canvas, {
      ...cfg,
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: css("--surface"), titleColor: css("--ink"), bodyColor: css("--ink-2"),
            borderColor: css("--line"), borderWidth: 1, padding: 10, boxPadding: 4,
            callbacks: { label: (c) => ` ${c.dataset.label}: ${fmt(c.parsed.y, unit, true) ?? "n/a"}` },
          },
        },
        scales: { x: { ...axisOpts(), ticks: { color: css("--muted"), maxRotation: 0, autoSkipPadding: 12, font: { size: 11 } }, grid: { display: false } }, y: axisOpts(unit) },
        ...(cfg.options || {}),
      },
    });
    state.charts.push(chart);
  }
  const barStyle = { borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: "bottom", maxBarThickness: 24, borderWidth: 0 };
  function phaseBars(canvas, rows, key, unit, label) {
    baseChart(canvas, {
      type: "bar",
      data: {
        labels: rows.map((r) => dayLabel(r.date)),
        datasets: [{
          label, data: rows.map((r) => r[key]), ...barStyle,
          backgroundColor: rows.map((r) => r.phase === "sale" ? css("--series-2") : css("--series-1")),
        }],
      },
    }, unit);
  }
  const legend = (items) => `<div class="chart-legend">${items.map(([v, l]) => `<span><i style="background:var(${v})"></i>${esc(l)}</span>`).join("")}</div>`;

  // ------------------------------------------------------------ data
  async function getJSON(url) {
    const r = await fetch(url, { credentials: "same-origin" });
    if (r.status === 401 || r.status === 403) { const e = new Error((await r.json().catch(() => ({}))).detail || "Sign in required"); e.auth = r.status; throw e; }
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
    return r.json();
  }
  async function loadPage(tab) {
    if (state.pages[tab] && tab !== "live") return state.pages[tab];
    state.pages[tab] = embedded ? embedded.pages[tab] : await getJSON(`/api/page/${tab}`);
    return state.pages[tab];
  }

  // ------------------------------------------------------------ shell
  function renderTabs() {
    document.getElementById("tabs").innerHTML = state.config.tabs
      .map((t) => `<a href="#${t.id}" ${t.id === state.tab ? 'aria-current="page"' : ""}>${esc(t.label)}</a>`).join("");
  }
  function renderMeta(page) {
    const s = state.status || {};
    const parts = [];
    if (page?.as_of) parts.push(`D-1 <strong>${dayLabel(page.as_of)}</strong>`);
    if (page?.generated_at) parts.push(`refreshed ${new Date(page.generated_at).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })} IST`);
    if (s.complete === false) parts.push(`<span class="chip pending">Waiting on ${Object.keys(s.missing || {}).length} source(s)</span>`);
    if (embedded) parts.push('<span class="chip pending">Preview build</span>');
    document.getElementById("meta-line").innerHTML = parts.join(" · ");
  }
  function statusStrip() {
    const s = state.status;
    if (!s || !s.checks) return "";
    const missing = s.missing || {};
    const chips = s.checks.map((c) => {
      const bad = missing[c.source];
      return `<span class="chip ${bad ? "missing" : "ok"}" title="${esc(bad || "latest " + c.latest_date)}">${esc(c.source.replace(/_/g, " "))} · ${esc(c.latest_date ? dayLabel(c.latest_date) : "none")}</span>`;
    });
    if (missing.shopify_sessions) chips.push(`<span class="chip missing" title="${esc(missing.shopify_sessions)}">shopify sessions</span>`);
    Object.entries(s.unavailable || {}).forEach(([k, v]) => chips.push(`<span class="chip pending" title="${esc(v)}">${esc(k.replace(/_/g, " "))}: unavailable</span>`));
    return `<div class="status" aria-label="Data sources">${chips.join("")}</div>`;
  }
  function notes(page) {
    return page.notes?.length ? `<ul class="notes">${page.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : "";
  }
  function table(columns, rows, opts = {}) {
    const head = columns.map((c) => `<th class="${c.text ? "text" : ""}" scope="col">${esc(c.label)}</th>`).join("");
    const body = rows.map((r) => `<tr class="${r._class || ""}">${columns.map((c) => {
      if (c.render) return `<td class="${c.text ? "text" : ""}">${c.render(r)}</td>`;
      return `<td>${cell(r[c.key], c.unit, r.na?.[c.key])}</td>`;
    }).join("")}</tr>`).join("");
    return `<div class="table-wrap" ${opts.maxHeight ? `style="max-height:${opts.maxHeight}"` : ""}><table><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${columns.length}" class="text na">No rows for this period.</td></tr>`}</tbody></table></div>`;
  }

  // ------------------------------------------------------------ tabs
  const R = {};

  // Ten-second view: checkout health plus Meta, Google and Shopify returns.
  function spark(points, colour) {
    const nums = points.map((q) => q.v).filter((v) => v !== null && v !== undefined);
    if (nums.length < 2) return "";
    const W = 200, H = 44, pad = 5, lo = Math.min(...nums), span = (Math.max(...nums) - lo) || 1, n = points.length - 1;
    const x = (i) => pad + (i * (W - 2 * pad)) / n, y = (v) => H - pad - ((v - lo) / span) * (H - 2 * pad);
    let d = "", pen = false;
    points.forEach((q, i) => { if (q.v === null || q.v === undefined) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(q.v).toFixed(1) + " "; pen = true; });
    const colW = (W - 2 * pad) / n;
    let bands = "", from = null;
    points.forEach((q, i) => {
      const sale = q.phase === "sale";
      if (sale && from === null) from = i;
      if ((!sale || i === points.length - 1) && from !== null) {
        const to = sale ? i : i - 1;
        bands += `<rect x="${Math.max(0, x(from) - colW / 2).toFixed(1)}" y="0" width="${(Math.min(W, x(to) + colW / 2) - Math.max(0, x(from) - colW / 2)).toFixed(1)}" height="${H}" fill="var(--accent-wash)"/>`;
        from = null;
      }
    });
    const last = points[points.length - 1];
    const dot = last.v === null || last.v === undefined ? "" : `<circle cx="${x(n).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="4" fill="${colour}" stroke="var(--surface)" stroke-width="2"/>`;
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Last 14 days; shaded days were sale days">${bands}<path d="${d}" fill="none" stroke="${colour}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${dot}</svg>`;
  }
  const STATUS = { ok: ["Healthy", "✓"], watch: ["Watch", "!"], problem: ["Problem", "✕"], unknown: ["No data", "–"] };
  function pulseHtml(p) {
    const pl = p.pulse;
    if (!pl) return "";
    const co = pl.checkout, [word, icon] = STATUS[co.status] || STATUS.unknown;
    const pct1 = (v) => (v === null || v === undefined ? "n/a" : (v * 100).toFixed(1) + "%");
    const stepRows = co.steps.map((st) => `<div class="steprow"><span>${esc(st.label)}${st.counts ? "" : ' <span class="sub">(context, not in the verdict)</span>'}</span><strong>${esc(pct1(st.value))}</strong><span class="sub">${st.delta === null ? "no baseline" : deltaHtml(st.delta, "rate")} · typical ${esc(pct1(st.baseline))}</span></div>`).join("");
    const checkout = `<article class="pcard checkout ${esc(co.status)}">
      <div class="plabel">Checkout</div>
      <div class="status-pill ${esc(co.status)}"><span class="ico" aria-hidden="true"><b>${icon}</b></span><span>${word}</span></div>
      <div class="vs">${esc(co.reason)}</div>
      <details class="steps"><summary>See the steps</summary>${stepRows}</details>
      <div class="psub">GoKwik funnel steps against a typical ${esc(pl.kind)} day</div>
    </article>`;
    const colours = { meta_sales_roas: "var(--series-1)", google_sales_roas: "var(--series-2)", perf_roas: "var(--accent)" };
    const cards = pl.cards.map((c) => `<article class="pcard">
      <div class="plabel">${esc(c.label)}</div>
      ${c.value === null || c.value === undefined ? `<div class="na">Data unavailable: ${esc(c.na || "not available")}</div>`
        : `<div class="hero">${esc(fmt(c.value, "x"))}</div>
           <div class="vs">${deltaHtml(c.delta, c.key)}<span>vs typical ${esc(pl.kind)} day ${esc(fmt(c.baseline, "x") ?? "n/a")}</span></div>
           ${spark(c.spark, colours[c.key] || "var(--accent)")}
           <div class="pfoot"><span>7 days ${esc(fmt(c.last7, "x") ?? "n/a")}</span><span>Month ${esc(fmt(c.mtd, "x") ?? "n/a")}</span>${c.mer !== null && c.mer !== undefined ? `<span>MER ${esc(fmt(c.mer, "x"))}</span>` : ""}</div>`}
      <div class="psub">${esc(c.sub)}</div>
    </article>`).join("");
    return `<section class="card">
      <div class="section-head"><h2>Right now</h2><span class="sub">D-1 ${esc(dayLabel(p.as_of))} · a ${esc(pl.kind)} day · ${esc(pl.baseline_note)}</span></div>
      <div class="pulse">${checkout}${cards}</div>
      ${statusStrip()}
    </section>`;
  }

  /*__RANGE_UI__*/
  /*__RANGE_TABS__*/

  R.health = (p) => {
    const hhmm = (iso) => iso ? new Date(iso).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Kolkata" }) : null;
    const srcCols = [
      { label: "Source", text: true, render: (r) => `<strong>${esc(r.label)}</strong><br><span class="sub">${esc(r.origin)}</span>` },
      { label: "Status", text: true, render: (r) => (r.state === "ok" ? '<span class="chip ok">Arrived</span>' : '<span class="chip missing">Waiting</span>') + (r.note ? `<br><span class="sub">${esc(r.note)}</span>` : "") },
      { label: "Latest day", render: (r) => esc(r.latest_date ? dayLabel(r.latest_date) : "none") },
      { label: "D-1 rows", render: (r) => esc(fmt(r.d1_rows, "int") ?? "–") },
      { label: "Arrived (IST)", render: (r) => esc(hhmm(r.arrived_at) || "–") },
    ];
    const recCols = [
      { label: "Check", text: true, render: (r) => esc(r.label) },
      { label: "Ours", render: (r) => esc(fmt(r.ours, r.unit, true) ?? "–") },
      { label: "Source says", render: (r) => esc(fmt(r.theirs, r.unit, true) ?? "–") },
      { label: "Difference", render: (r) => r.diff === null || r.diff === undefined ? "–" : esc(fmt(r.diff, r.unit, true) ?? "–") + (r.diff_pct === null || r.diff_pct === undefined ? "" : ` <span class="sub">(${(r.diff_pct * 100).toFixed(2)}%)</span>`) },
      { label: "Result", text: true, render: (r) => r.ok === true ? '<span class="chip ok">Matches</span>'
          : r.ok === false ? `<span class="chip missing" title="${esc(r.note || "")}">Differs${r.block ? " · holds the day open" : ""}</span>`
          : `<span class="chip pending" title="${esc(r.note || "")}">Not checked</span>` },
    ];
    const labels = p.source_labels || {};
    const histCols = [
      { label: "Day", text: true, render: (r) => `<strong>${esc(dayLabel(r.day))}</strong>` },
      { label: "Complete (IST)", render: (r) => r.complete ? esc(hhmm(r.completed_at) || "yes") : '<span class="cell-na" title="Not complete when last run">–</span>' },
      ...Object.entries(labels).map(([k, l]) => ({ label: l, render: (r) => esc(hhmm(r.arrived?.[k]) || "–") })),
    ];
    const waiting = (p.waiting_on || []).map((k) => labels[k] || k.replace(/_/g, " ")).join(", ");
    const head = p.complete
      ? `<p><span class="chip ok">All sources are in for ${esc(dayLabel(p.as_of))}</span> <span class="sub">${p.attempts ?? "?"} runs so far</span></p>`
      : `<div class="banner">Waiting on: ${esc(waiting)}. Each run rebuilds the pages with whatever is present, and an email goes out from 10:00 IST if this is still open.</div>`;
    $main.innerHTML = `
      <section class="card">
        <div class="section-head"><h2>Sources for D-1</h2><span class="sub">${esc(dayLabel(p.as_of))}</span></div>
        ${head}
        ${table(srcCols, p.sources)}
      </section>
      <section class="card">
        <div class="section-head"><h2>Cross-checks</h2><span class="sub">Our copy against each source's own total</span></div>
        ${p.reconcile?.length ? table(recCols, p.reconcile) : '<p class="na">No cross-check has run yet for this day.</p>'}
      </section>
      <section class="card">
        <div class="section-head"><h2>Last days</h2><span class="sub">When each source first had the day</span></div>
        ${table(histCols, p.history || [])}
      </section>
      <section class="card">${notes(p)}</section>`;
  };

  /*__RETENTION_UI__*/

  // ------------------------------------------------------------ live (Today)
  const LIVE = { base: "typical", metric: "gmv" };
  const liveAge = (p) => Math.max(0, Math.round((Date.now() - new Date(p.generated_at).getTime()) / 60000));
  const liveWhen = (iso) => new Date(iso).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit", hour12: true });
  function liveTick() {
    const p = state.pages.live, el = document.getElementById("live-age");
    if (!p || !el) return;
    const a = liveAge(p);
    el.textContent = a < 1 ? "just now" : a + " min ago";
    const warn = document.getElementById("live-stale");
    if (warn) warn.hidden = a < 30;
  }
  async function liveRefresh() {
    if (state.tab !== "live" || document.hidden || embedded) return;
    try {
      const page = await getJSON("/api/page/live");
      if (page && page.generated_at !== state.pages.live?.generated_at) {
        state.pages.live = page; destroyCharts(); R.live(page);
      }
    } catch (e) { /* keep showing the last good view; the age label says how old it is */ }
  }
  R.live = (p) => {
    clearInterval(state.liveTimer); clearInterval(state.liveTick);
    state.liveTimer = setInterval(liveRefresh, (p.refresh_seconds || 180) * 1000);
    state.liveTick = setInterval(liveTick, 20000);
    const sh = p.shopify, vsKey = LIVE.base === "typical" ? "vs_typical" : "vs_yesterday";
    const baseKey = LIVE.base === "typical" ? "typical" : "yesterday";
    const baseLabel = sh ? (LIVE.base === "typical" ? sh.typical_label : sh.yesterday_label) : "";
    const chips = p.sources.map((s) => `<span class="chip ${s.ok ? "ok" : "missing"}" title="${esc(s.reason || s.note)}">${esc(s.label)} · ${s.as_of ? esc(liveWhen(s.as_of)) : "no data"}</span>`).join("");
    const head = `<section class="card">
      <div class="section-head"><h2>Today · ${esc(p.weekday)} ${esc(dayLabel(p.today))}</h2>
        <span class="sub">updated <span id="live-age"></span> · refreshes itself every ${Math.round((p.refresh_seconds || 180) / 60)} min · D-1 stays on the other tabs</span></div>
      <div class="banner" id="live-stale" hidden>This view is more than 30 minutes old, so the live refresh may be failing. The numbers below are the last good ones.</div>
      <div class="status" aria-label="Data sources and freshness">${chips}</div>
      ${sh ? `<div class="live-ctl"><span class="sub">Compare today so far with</span>
        <div class="seg" id="live-base"><button type="button" data-b="typical" aria-pressed="${LIVE.base === "typical"}">${esc(sh.typical_label)}</button><button type="button" data-b="yesterday" aria-pressed="${LIVE.base === "yesterday"}">Yesterday, same time</button></div></div>` : ""}
    </section>`;
    const tiles = sh ? `<section class="card"><div class="section-head"><h2>So far today</h2><span class="sub">each figure compared at the same time of day</span></div>
      <div class="tiles">${sh.tiles.map((t) => `<div class="tile">
        <div class="label">${esc(t.label)}</div>
        ${t.value === null || t.value === undefined ? `<div class="na">Data unavailable: ${esc(t.na || "not available")}</div>`
          : `<div class="value">${esc(fmt(t.value, t.unit, true))}</div>
             <div class="foot">${deltaHtml(t[vsKey], t.key)}<span>vs ${esc(fmt(t[baseKey], t.unit, true) ?? "n/a")}</span></div>`}
      </div>`).join("")}</div></section>`
      : `<section class="card"><div class="section-head"><h2>So far today</h2></div><p class="na">Data unavailable: ${esc(p.unavailable.shopify_orders || "Shopify orders not available")}</p></section>`;
    const chart = sh ? `<section class="card"><div class="section-head"><h2>Through the day</h2>
        <div class="seg" id="live-metric">${[["gmv", "GMV"], ["orders", "Orders"], ["sessions", "Sessions"]].map(([k, l]) => `<button type="button" data-m="${k}" aria-pressed="${LIVE.metric === k}">${l}</button>`).join("")}</div></div>
      ${legend([["--accent", "Today"], ["--muted", baseLabel]])}
      <div class="chart-box"><canvas id="c-live" aria-label="Running total through the day, today against the comparison"></canvas></div></section>` : "";
    const cards = `<section class="card"><div class="section-head"><h2>Returns so far today</h2><span class="sub">vs yesterday's final · ad platforms report late, so today reads low</span></div>
      <div class="pulse">${p.cards.map((c) => `<article class="pcard">
        <div class="plabel">${esc(c.label)}</div>
        ${c.value === null || c.value === undefined ? `<div class="na">Data unavailable: ${esc(c.na || "not available")}</div>`
          : `<div class="hero">${esc(fmt(c.value, "x"))}</div>
             <div class="vs">${deltaHtml(c.delta, c.key)}<span>vs yesterday ${esc(fmt(c.yesterday, "x") ?? "n/a")}</span></div>`}
        <div class="psub">${esc(c.sub)}</div></article>`).join("")}</div></section>`;
    const gk = p.gokwik;
    const pct1 = (v) => (v === null || v === undefined ? "n/a" : (v * 100).toFixed(1) + "%");
    const checkout = `<section class="card"><div class="section-head"><h2>Checkout (GoKwik)</h2>
        <span class="sub">${gk.na ? "" : `as loaded ${gk.age_minutes === null || gk.age_minutes === undefined ? "" : gk.age_minutes + " min ago"} · rates against the last ${gk.typical_days} days`}</span></div>
      ${gk.na ? `<p class="na">Data unavailable: ${esc(gk.na)}</p>`
        : `${gk.stale ? '<div class="banner">The latest GoKwik load is old, so these rates are not current.</div>' : ""}
           ${table([
             { label: "Step", text: true, render: (r) => esc(r.label) },
             { label: "Customers", render: (r) => esc(fmt(r.count, "int") ?? "n/a") },
             { label: "Step rate", render: (r) => r.rate === null ? '<span class="na">–</span>' : esc(pct1(r.rate)) },
             { label: "Typical", render: (r) => r.typical === null ? '<span class="na">–</span>' : esc(pct1(r.typical)) },
             { label: "vs typical", render: (r) => r.delta === null ? '<span class="flat">–</span>' : deltaHtml(r.delta, "rate") },
           ], gk.steps)}
           <p class="legend-note">Overall checkout conversion ${esc(pct1(gk.overall))} against a typical ${esc(pct1(gk.overall_typical))}.</p>`}
    </section>`;
    const adTable = (title, blk) => {
      if (blk.na && !blk.today) return `<section class="card"><div class="section-head"><h2>${esc(title)}</h2></div><p class="na">Data unavailable: ${esc(blk.na)}</p></section>`;
      const t = blk.today || {};
      const rows = blk.campaigns.map((c) => ({ ...c }));
      return `<section class="card"><div class="section-head"><h2>${esc(title)}</h2>
        <span class="sub">spend ${esc(fmt(t.spend, "inr", true) ?? "n/a")}${blk.spend_pct_of_yesterday === null || blk.spend_pct_of_yesterday === undefined ? "" : ` · ${(blk.spend_pct_of_yesterday * 100).toFixed(0)}% of yesterday's`} · sales-campaign ROAS ${esc(fmt(t.roas, "x") ?? "n/a")}</span></div>
        ${table([
          { label: "Campaign", text: true, render: (r) => `${esc(r.campaign)}${r.awareness ? ' <span class="sub">Awareness, not in ROAS</span>' : ""}` },
          { label: "Spend", render: (r) => esc(fmt(r.spend, "inr") ?? "n/a") },
          { label: "Value", render: (r) => esc(fmt(r.value, "inr") ?? "n/a") },
          { label: "ROAS", render: (r) => r.roas === null ? '<span class="na">–</span>' : esc(fmt(r.roas, "x")) },
        ], rows, { maxHeight: "50vh" })}</section>`;
    };
    $main.innerHTML = head + tiles + chart + cards + checkout + `<div class="grid-2">${adTable("Meta campaigns today", p.meta)}${adTable("Google Ads campaigns today", p.google)}</div><section class="card">${notes(p)}</section>`;
    liveTick();
    document.getElementById("live-base")?.addEventListener("click", (ev) => { const b = ev.target.closest("button[data-b]"); if (b) { LIVE.base = b.dataset.b; destroyCharts(); R.live(p); } });
    document.getElementById("live-metric")?.addEventListener("click", (ev) => { const b = ev.target.closest("button[data-m]"); if (b) { LIVE.metric = b.dataset.m; destroyCharts(); R.live(p); } });
    const canvas = document.getElementById("c-live");
    if (canvas && sh) {
      const ser = sh.curves.series[LIVE.metric], unit = LIVE.metric === "gmv" ? "inr" : "int";
      const labels = sh.curves.hours.map((h) => (h % 12 || 12) + (h < 12 ? "a" : "p"));
      const compare = ser[LIVE.base === "typical" ? "typical" : "yesterday"];
      baseChart(canvas, {
        type: "line",
        data: { labels, datasets: [
          { label: baseLabel, data: compare || [], borderColor: css("--muted"), borderDash: [5, 4], borderWidth: 2, pointRadius: 0, tension: 0.25 },
          { label: "Today", data: ser.today, borderColor: css("--accent"), backgroundColor: css("--accent"), borderWidth: 2.5, pointRadius: 0, tension: 0.25, spanGaps: false },
        ] },
      }, unit);
    }
  };

  // ------------------------------------------------------------ routing
  async function show() {
    const ids = state.config.tabs.map((t) => t.id);
    const want = location.hash.slice(1);
    state.tab = ids.includes(want) ? want : ids[0];
    renderTabs();
    destroyCharts();
    clearInterval(state.liveTimer); clearInterval(state.liveTick);
    $main.innerHTML = '<p class="empty">Loading…</p>';
    try {
      const page = await loadPage(state.tab);
      if (!page) throw new Error("This tab has not been built yet.");
      renderMeta(page);
      R[state.tab](page);
      try { localStorage.setItem("asaya-dash-tab", state.tab); } catch (e) { /* storage blocked */ }
    } catch (e) {
      if (e.auth) return signIn(e.message);
      $main.innerHTML = `<section class="card"><h2>Couldn't load this tab</h2><p>${esc(e.message)}</p></section>`;
    }
  }

  function signIn(message) {
    $main.innerHTML = `<div class="signin"><h2>Sign in to the Asaya dashboard</h2>
      <p class="sub">${esc(message && message !== "Sign in required" ? message : "Use your Google account. Access is limited to the people on the dashboard allowlist.")}</p>
      <div id="gsi"></div></div>`;
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.onload = () => {
      google.accounts.id.initialize({
        client_id: state.config.google_client_id,
        callback: async (resp) => {
          const r = await fetch("/auth/google", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ credential: resp.credential }) });
          if (r.ok) { state.pages = {}; boot(); } else { signIn((await r.json().catch(() => ({}))).detail || "Sign-in failed"); }
        },
      });
      google.accounts.id.renderButton(document.getElementById("gsi"), { theme: "outline", size: "large", shape: "pill" });
    };
    document.head.appendChild(s);
  }

  async function boot() {
    try {
      if (embedded) {
        state.config = embedded.config; state.status = embedded.status;
      } else {
        state.config = await getJSON("/api/config");
        if (!state.config.dev_mode) await getJSON("/api/me");
        state.status = await getJSON("/api/status").catch(() => null);
      }
    } catch (e) {
      if (e.auth) return signIn(e.message);
      $main.innerHTML = `<section class="card"><h2>The dashboard is not reachable</h2><p>${esc(e.message)}</p></section>`;
      return;
    }
    if (!location.hash) { try { const t = localStorage.getItem("asaya-dash-tab"); if (t) history.replaceState(null, "", "#" + t); } catch (e) { /* storage blocked */ } }
    show();
  }

  window.addEventListener("hashchange", show);
  const rerender = () => { if (state.tab && state.pages[state.tab]) { destroyCharts(); R[state.tab](state.pages[state.tab]); } };
  const themeBtn = document.getElementById("theme-toggle");
  const paintToggle = () => {
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    themeBtn.setAttribute("aria-pressed", String(dark));
    themeBtn.innerHTML = dark ? "<span aria-hidden=\"true\">☀</span> Light" : "<span aria-hidden=\"true\">☾</span> Dark";
    themeBtn.title = dark ? "Switch to the light theme" : "Switch to the dark theme";
  };
  themeBtn.addEventListener("click", () => {
    const dark = document.documentElement.getAttribute("data-theme") !== "dark";
    if (dark) document.documentElement.setAttribute("data-theme", "dark"); else document.documentElement.removeAttribute("data-theme");
    try { localStorage.setItem("asaya-theme", dark ? "dark" : "light"); } catch (e) { /* storage blocked */ }
    paintToggle();
  });
  paintToggle();
  new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  boot();
})();
</script>
