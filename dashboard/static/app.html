<title>Asaya D2C Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky brand + tab bar; each tab is a vertical stack of sections,
   summary (tiles, period tables) before detail (charts, then dense tables). */
:root {
  /* Warm Ivory: a soft cream page, white cards, black text, brown headings.
     Brand brown stays the accent (tabs, buttons, links). Chart blue and sale
     orange are the brand hues stepped into the validated lightness band.
     Light is the default; dark is a toggle in the header, never automatic. */
  --bg: #fbf8f3;
  --surface: #ffffff;
  --ink: #1a1a1a;
  --ink-2: #5c5650;
  --muted: #8a837b;
  --line: #e8e1d8;
  --axis: #d4ccc2;
  --brand: #674130;         /* wordmark brown */
  --head: #674130;          /* headings */
  --accent: #674130;        /* tabs, links, focus */
  --accent-wash: #f1e8df;
  --series-1: #2c60ac;      /* Meta / BAU (product-label blue) */
  --series-2: #d96a1c;      /* Google / Sale (sale-tag orange) */
  --good: #1e6b34;
  --bad: #b8004c;           /* badge crimson */
  --warn: #8f5a00;
  --warn-bg: #fdf0dc;
  --warn-ink: #6b4300;
  --bad-bg: #fbe3ec;
  --good-bg: #e4f1e5;
  --font-display: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --radius: 12px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #17110e; --surface: #211915; --ink: #f6ece4; --ink-2: #d2c0b4; --muted: #a39084;
  --line: #3a2d26; --axis: #4b3c33; --brand: #e8c7b1; --head: #e8c7b1; --accent: #e0b99f; --accent-wash: #33261f;
  --series-1: #3987e5; --series-2: #dd6a2a; --good: #52c26a; --bad: #ff7aa8; --warn: #f0b74a;
  --warn-bg: #3a2c10; --warn-ink: #f4d58a; --bad-bg: #3e1626; --good-bg: #17301d;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; color: var(--head); }
h2 { font-size: 17px; font-weight: 650; letter-spacing: -0.005em; }
h3 { font-size: 14px; font-weight: 600; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-inner, main { max-width: 1760px; margin: 0 auto; padding-left: max(clamp(16px, 3vw, 48px), env(safe-area-inset-left, 0px)); padding-right: max(clamp(16px, 3vw, 48px), env(safe-area-inset-right, 0px)); }
.bar-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.015em; line-height: 1; color: var(--brand); }
.brand span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 auto; min-width: 0; }
nav.tabs a { text-decoration: none; color: var(--ink-2); padding: 6px 12px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
nav.tabs a[aria-current="page"] { background: var(--accent-wash); color: var(--accent); }
nav.tabs a:hover { color: var(--ink); }
.theme-toggle { font: inherit; font-size: 12px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.theme-toggle:hover { border-color: var(--accent); color: var(--ink); }
.meta-line { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 12px; flex-wrap: wrap; }

main { padding-block: 16px 48px; display: grid; gap: 16px; }
section.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(14px, 1.2vw, 20px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; align-content: start; }
.section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.sub { color: var(--muted); font-size: 12px; }
.grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); }
/* a card left alone on a row of a two-column grid takes the whole row (set by fillGrids) */
.grid-2 > .solo, .d1-grid > .solo { grid-column: 1 / -1; }

.status { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip.ok::before { content: "●"; color: var(--good); font-size: 9px; }
.chip.missing { background: var(--bad-bg); border-color: transparent; color: var(--bad); }
.chip.missing::before { content: "▲"; font-size: 9px; }
.chip.pending { background: var(--warn-bg); border-color: transparent; color: var(--warn-ink); }
.phase { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; }
.phase.sale { background: color-mix(in srgb, var(--series-2) 16%, transparent); color: var(--ink); }
.phase.bau { background: color-mix(in srgb, var(--series-1) 12%, transparent); color: var(--ink-2); }
.phase.mixed { background: linear-gradient(90deg, color-mix(in srgb, var(--series-1) 12%, transparent) 45%, color-mix(in srgb, var(--series-2) 16%, transparent) 55%); color: var(--ink); text-transform: none; letter-spacing: 0; }

.pulse { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; display: grid; gap: 10px; align-content: start; min-width: 0; font-variant-numeric: tabular-nums; }
.pcard .plabel { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.pcard .psub { font-size: 12px; color: var(--muted); line-height: 1.35; }
.pcard .hero { font-family: var(--font-body); font-size: clamp(38px, 5vw, 52px); font-weight: 700; line-height: 1; letter-spacing: -0.025em; }
.pcard .vs { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.pcard .pfoot { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; color: var(--muted); }
.pcard svg.spark { width: 100%; height: 44px; display: block; overflow: visible; }
.pcard.checkout { border-left: 6px solid var(--line); }
.pcard.checkout.ok { border-left-color: var(--good); }
.pcard.checkout.watch { border-left-color: var(--warn); }
.pcard.checkout.problem { border-left-color: var(--bad); }
.status-pill { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: clamp(30px, 4.4vw, 40px); line-height: 1.05; letter-spacing: -0.02em; }
.status-pill { --c: var(--muted); color: var(--c); }
.status-pill.ok { --c: var(--good); } .status-pill.watch { --c: var(--warn); } .status-pill.problem { --c: var(--bad); }
.status-pill .ico { display: inline-grid; place-items: center; width: 1.05em; height: 1.05em; border-radius: 50%; background: var(--c); flex: none; }
.status-pill .ico b { color: var(--surface); font-size: 0.6em; font-weight: 700; line-height: 1; }
.steps summary { cursor: pointer; font-size: 12px; color: var(--accent); font-weight: 600; }
.steps .steprow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 2px 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.steps .steprow:last-child { border-bottom: 0; }
.steps .steprow .sub { text-align: right; }

.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 3px; align-content: start; }
.tile .label { color: var(--ink-2); font-size: 12px; font-weight: 500; overflow-wrap: anywhere; }
.tile .value { font-family: var(--font-display); font-size: clamp(18px, 1.45vw, 22px); font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; line-height: 1.15; white-space: nowrap; }
.tile .foot { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.na { color: var(--muted); font-size: 12px; }
.tile .na { font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
.up { color: var(--good); }
.down { color: var(--bad); }
.flat { color: var(--ink-2); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
/* a table of two or three columns is as wide as its content, not the screen */
.table-wrap.fit { width: fit-content; max-width: 100%; min-width: min(100%, 440px); }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
tbody tr:last-child td { border-bottom: 0; }
th { position: sticky; top: 0; z-index: 1; background: color-mix(in srgb, var(--accent-wash) 35%, var(--surface)); color: var(--ink-2); font-weight: 600; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; line-height: 1.25; vertical-align: bottom; white-space: normal; min-width: 64px; }
th:first-child, td:first-child, td.text, th.text { text-align: left; }
td.text { white-space: normal; overflow-wrap: anywhere; min-width: 96px; max-width: 360px; }
tbody tr:hover td { background: color-mix(in srgb, var(--accent-wash) 60%, transparent); }
tr.total td { font-weight: 600; border-top: 2px solid var(--axis); }
tr.delta td { font-weight: 600; }
tr.group td { background: var(--accent-wash); color: var(--ink-2); font-size: 12px; font-weight: 600; text-align: left; }
td .cell-na { color: var(--muted); cursor: help; border-bottom: 1px dotted var(--muted); }
.legend-note { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.45; }
.live-ctls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; margin-top: 10px; }
.live-ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.chart-box { position: relative; height: 240px; }
.chart-legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); }
.chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 12px; border: 0; background: transparent; color: var(--ink-2); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent); font-weight: 600; }

.commentary { white-space: pre-wrap; line-height: 1.6; max-width: 80ch; }
.notes { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 12px; display: grid; gap: 4px; max-width: 110ch; }
.banner { border-radius: 8px; padding: 10px 12px; background: var(--warn-bg); color: var(--warn-ink); font-size: 13px; }
.signin { max-width: 420px; margin: 12vh auto; text-align: center; display: grid; gap: 14px; justify-items: center; }
.empty { color: var(--muted); padding: 24px 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/*__RETENTION_CSS__*/
/*__RANGE_CSS__*/
/*__ASK_CSS__*/
/*__UI_CSS__*/
</style>
<script>try { if (localStorage.getItem("asaya-theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) { /* storage blocked: stay light */ }</script>

<header class="bar" id="bar">
  <div class="bar-inner">
    <div class="brand"><h1>asaya</h1><span>D2C</span></div>
    <nav class="tabs" id="tabs" aria-label="Dashboard tabs"></nav>
    <div class="bar-right">
      <span id="status-pill"></span>
      <span id="ask-slot"></span>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false"></button>
    </div>
  </div>
  <div class="bar-sub" id="bar-sub" hidden><div class="bar-sub-inner" id="rg-slot"></div></div>
</header>
<main id="main"><p class="empty">Loading the dashboard…</p></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
/*__RETENTION_ENGINE__*/
/*__RANGE_ENGINE__*/
</script>
<script>
(() => {
  "use strict";
  const embedded = window.__DASH__ || null;   // set by the preview build; absent on Cloud Run
  const state = { config: null, status: null, pages: {}, tab: null, charts: [], drill: "channel", d1View: "table" };
  const $main = document.getElementById("main");
  // Every table on every tab follows the same rule: it uses the width it is
  // given; if it does not fit, it steps down to a denser style; if it still
  // does not fit, it scrolls sideways with its first column pinned. Run after
  // each render and on resize, so no tab needs its own fix.
  function fitTables() {
    for (const wrap of $main.querySelectorAll(".table-wrap")) {
      const t = wrap.querySelector("table");
      if (!t || t.classList.contains("tree") || t.classList.contains("matrix")) continue;
      t.classList.remove("dense", "denser", "pin-first");
      if (wrap.scrollWidth <= wrap.clientWidth + 1) continue;
      t.classList.add("dense");
      if (wrap.scrollWidth <= wrap.clientWidth + 1) continue;
      t.classList.add("denser");
      if (wrap.scrollWidth > wrap.clientWidth + 1) t.classList.add("pin-first");
    }
  }
  // a card alone on a row of a two-column grid spans the row, so no half row stays empty
  function fillGrids() {
    for (const grid of $main.querySelectorAll(".grid-2, .d1-grid")) {
      const kids = [...grid.children].filter((k) => k.offsetParent !== null);
      kids.forEach((k) => k.classList.remove("solo"));
      const rows = new Map();
      for (const k of kids) (rows.get(k.offsetTop) || rows.set(k.offsetTop, []).get(k.offsetTop)).push(k);
      const cols = getComputedStyle(grid).gridTemplateColumns.split(" ").length;
      if (cols < 2) continue;
      for (const row of rows.values()) if (row.length === 1 && !row[0].classList.contains("wide")) row[0].classList.add("solo");
    }
    // KPI tiles in even rows: 11 tiles that fit 8 a row become 6 + 5, not 8 + 3
    for (const t of $main.querySelectorAll(".tiles")) {
      t.style.gridTemplateColumns = "";
      const n = t.children.length, w = t.clientWidth, last = t.lastElementChild;
      if (last) last.style.gridColumn = "";
      if (!w || n < 2) continue;
      const fit = Math.max(1, Math.floor((w + 10) / (150 + 10)));
      if (n <= fit) continue;
      const cols = Math.ceil(n / Math.ceil(n / fit));
      t.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
      // two to a row (phones): an odd last tile takes the whole row
      if (cols === 2 && n % 2) last.style.gridColumn = "1 / -1";
    }
  }
  let fitQueued = false;
  const queueFit = () => { if (!fitQueued) { fitQueued = true; requestAnimationFrame(() => { fitQueued = false; fillGrids(); fitTables(); }); } };
  new MutationObserver(queueFit).observe($main, { childList: true, subtree: true });
  window.addEventListener("resize", queueFit);
  $main.addEventListener("toggle", queueFit, true);
  /* expandable rows in any table: a group's children, and the collapsed
     "Reconcile to Shopify" rows */
  const rowToggle = (row) => {
    const grp = row.dataset.grp, rid = row.dataset.recon;
    const open = row.getAttribute("aria-expanded") !== "true";
    row.setAttribute("aria-expanded", String(open)); row.classList.toggle("open", open);
    if (grp) row.closest("tbody").querySelectorAll(`tr[data-parent="${grp}"]`).forEach((r) => { r.hidden = !open; });
    if (rid) { row.closest("tbody").querySelectorAll(`tr[data-rid="${rid}"]`).forEach((r) => { r.hidden = !open; }); row.firstElementChild.textContent = (open ? "▾" : "▸") + row.firstElementChild.textContent.slice(1); }
  };
  $main.addEventListener("click", (ev) => { const r = ev.target.closest("tr[data-grp], tr[data-recon]"); if (r) rowToggle(r); });
  $main.addEventListener("keydown", (ev) => { if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("tr[data-grp], tr[data-recon]")) { ev.preventDefault(); rowToggle(ev.target); } });

  // ------------------------------------------------------------ formatting
  const inGroup = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 });
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // one formatter and one delta colour rule, from the metric registry (metrics.js)
  const inrCompact = (v) => mCompactInr(v);
  const FMT_OF = { inr: "currency", inr2: "currency2", int: "count", num: "count", pct: "percent", x: "ratio", pp: "pp" };
  function fmt(v, unit, compact) {
    if (v === null || v === undefined || Number.isNaN(v)) return null;
    return FMT_OF[unit] ? mFormat(FMT_OF[unit], v, compact) : String(v);
  }
  const NEUTRAL_DELTA = new Set(["spend", "meta_spend", "google_spend", "perf_spend", "sessions", "awareness_sessions", "reddit_spend", "crm_aff_spend", "total_spend", "perf_sessions", "all_spend", "affiliate_spend", "crm_spend", "units"]);
  const deltaDir = (key) => (METRICS[key] ? METRICS[key].dir : NEUTRAL_DELTA.has(key) || /spend$/.test(key || "") ? "neutral" : /^(cps|cpp|cpm|cpc|cost|landed)/.test(key || "") ? "lower" : "higher");
  function deltaHtml(d, key, small) { return mDeltaHtml(key, d, { dir: deltaDir(key), small }); }
  function cell(v, unit, reason) {
    const s = fmt(v, unit);
    if (s !== null) return esc(s);
    return `<span class="cell-na" title="Data unavailable: ${esc(reason || "not available")}">n/a</span>`;
  }
  const dayLabel = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" });
  const phaseChip = (p, note) => !p ? ""
    : p === "mixed" ? `<span class="phase mixed" title="${esc(note || "A sale went live or ended on this day")}">${esc(note ? note.replace(/^sale /, "") : "Transition")}</span>`
    : `<span class="phase ${p}" ${note ? `title="${esc(note)}"` : ""}>${p === "sale" ? "Sale" : "BAU"}</span>`;

  // ------------------------------------------------------------ charts
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  function destroyCharts() { state.charts.forEach((c) => c.destroy()); state.charts = []; }
  function axisOpts(unit) {
    return {
      grid: { color: css("--line"), drawTicks: false },
      border: { color: css("--axis") },
      ticks: { color: css("--muted"), font: { family: css("--font-body"), size: 11 }, padding: 6,
        callback: (v) => unit === "inr" ? inrCompact(v) : unit === "pct" ? (v * 100).toFixed(1) + "%" : unit === "x" ? v.toFixed(1) + "x" : inGroup.format(v) },
    };
  }
  function baseChart(canvas, cfg, unit) {
    if (!window.Chart) { canvas.parentElement.innerHTML = '<p class="na">Charts could not load. The tables below carry the same numbers.</p>'; return; }
    const chart = new Chart(canvas, {
      ...cfg,
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: css("--surface"), titleColor: css("--ink"), bodyColor: css("--ink-2"),
            borderColor: css("--line"), borderWidth: 1, padding: 10, boxPadding: 4,
            callbacks: { label: (c) => ` ${c.dataset.label}: ${fmt(c.parsed.y, unit, true) ?? "n/a"}` },
          },
        },
        scales: { x: { ...axisOpts(), ticks: { color: css("--muted"), maxRotation: 0, autoSkipPadding: 12, font: { size: 11 } }, grid: { display: false } }, y: axisOpts(unit) },
        ...(cfg.options || {}),
      },
    });
    state.charts.push(chart);
  }
  const barStyle = { borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: "bottom", maxBarThickness: 24, borderWidth: 0 };
  const legend = (items) => `<div class="chart-legend">${items.map(([v, l]) => `<span><i style="background:var(${v})"></i>${esc(l)}</span>`).join("")}</div>`;

  // ------------------------------------------------------------ data
  async function getJSON(url) {
    const r = await fetch(url, { credentials: "same-origin" });
    if (r.status === 401 || r.status === 403) { const e = new Error((await r.json().catch(() => ({}))).detail || "Sign in required"); e.auth = r.status; throw e; }
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
    return r.json();
  }
  async function loadPage(tab) {
    if (state.pages[tab] && tab !== "live") return state.pages[tab];
    state.pages[tab] = embedded ? embedded.pages[tab] : await getJSON(`/api/page/${tab}`);
    return state.pages[tab];
  }

  // ------------------------------------------------------------ shell
  function renderTabs() {
    const link = (t) => `<a href="#${t.id}" class="${t.report ? "report" : ""}" ${t.id === state.tab ? 'aria-current="page"' : ""}>${esc(t.label)}</a>`;
    const tabs = state.config.tabs;
    document.getElementById("tabs").innerHTML = tabs.filter((t) => !t.report).map(link).join("")
      + (tabs.some((t) => t.report) ? `<span class="tabs-gap" aria-hidden="true"></span>${tabs.filter((t) => t.report).map(link).join("")}` : "");
  }
  /* One data status pill in the header, for every tab: green when every source
     is in, amber naming what is late. It opens Data health. */
  const SRC_LABEL = { shopify_orders: "Shopify orders", shopify_order_items: "Shopify order lines", shopify_sessions: "Shopify sessions", gokwik_funnel: "GoKwik", gokwik_orders: "GoKwik orders", google_ads: "Google Ads", meta_ads: "Meta", meta: "Meta" };
  function renderMeta(page) {
    const s = state.status || {}, el = document.getElementById("status-pill");
    if (!el) return;
    const late = Object.keys(s.missing || {}), un = Object.keys(s.unavailable || {});

    const when = page?.generated_at ? `refreshed ${new Date(page.generated_at).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })} IST` : "";

    } else if (un.length) { cls = "late"; text = un.length === 1 ? `${un[0].replace(/^sheet_/, "").replace(/_/g, " ")} unavailable` : `${un.length} inputs unavailable`; }

    el.innerHTML = `<a class="spill ${cls}" href="#health" title="${esc(tip)}"><i aria-hidden="true"></i>${esc(text)}</a>`;

  /* The second header row: the date picker on range tabs, a fixed line on

    return `<div class="table-wrap${columns.length <= 3 && !opts.full ? " fit" : ""}" ${opts.maxHeight ? `style="max-height:${opts.maxHeight}"` : ""}><table><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${columns.length}" class="text na">No rows for this period.</td></tr>`}</tbody></table></div>`;
  }

  // ------------------------------------------------------------ tabs
  const R = {};

  /*__RANGE_UI__*/
  /*__RANGE_FUNNEL__*/
  /*__RANGE_TABS__*/
  /*__RANGE_TREE__*/

  R.health = async (p) => {

    $main.innerHTML = '<p class="empty">Loading…</p>';
    const pg = {};
    for (const t of ["overview", "funnel", "marketing", "products", "region", "d1", "days", "product_days", "meta_ads", "google_ads", "cro", "awareness"]) { try { pg[t] = await loadPage(t); } catch (e) { pg[t] = null; } }
    if (state.tab !== "health") return;
    const st = state.status || {}, labels = p.source_labels || {};
    // 1. sources
    const srcCols = [
      { label: "Source", text: true, render: (r) => `<strong>${esc(r.label)}</strong><br><span class="sub">${esc(r.origin)}</span>` },
      { label: "Status", text: true, render: (r) => (r.state === "ok" ? '<span class="chip ok">Arrived</span>' : '<span class="chip missing">Waiting</span>') + (r.note ? `<br><span class="sub">${esc(r.note)}</span>` : "") },
      { label: "Latest day", render: (r) => esc(r.latest_date ? dayLabel(r.latest_date) : "none") },
      { label: "D-1 rows", render: (r) => esc(fmt(r.d1_rows, "int") ?? "–") },
      { label: "Arrived (IST)", render: (r) => esc(hhmm(r.arrived_at) || "–") },
    ];
    const waiting = (p.waiting_on || []).map((k) => labels[k] || k.replace(/_/g, " ")).join(", ");
    const head = p.complete
      ? `<div class="ck"><span class="spill ok"><i></i>All sources are in for ${esc(dayLabel(p.as_of))}</span>${p.attempts ? `<span class="why">${p.attempts} refresh runs so far</span>` : ""}</div>`
      : `<div class="ck"><span class="spill late"><i></i>Waiting on ${esc(waiting)}</span><span class="why">Each run rebuilds the pages with whatever is present; an alert email goes out if this is still open by mid-morning.</span></div>`;
    const un = Object.entries(st.unavailable || {});
    const inputs = un.length ? table([{ label: "Input", text: true, render: (r) => `<strong>${esc(r[0].replace(/^sheet_/, "sheet: ").replace(/_/g, " "))}</strong>` }, { label: "What is wrong", text: true, render: (r) => esc(r[1]) }], un) : '<p class="sub">Every other input (spend sheets, sale calendar, APIs) is in.</p>';
    // 2. checks
    const recCols = [
      { label: "Check", text: true, render: (r) => esc(r.label) },
      { label: "Ours", render: (r) => esc(fmt(r.ours, r.unit, true) ?? "–") },

      { label: "Difference", render: (r) => (r.diff == null ? "–" : esc(fmt(r.diff, r.unit, true) ?? "–") + (r.diff_pct == null ? "" : ` <span class="sub">(${(r.diff_pct * 100).toFixed(2)}%)</span>`)) },
      { label: "Result", text: true, render: (r) => r.ok === true ? '<span class="chip ok">Matches</span>' : r.ok === false ? `<span class="chip missing" title="${esc(r.note || "")}">Differs${r.block ? " · holds the day open" : ""}</span>` : `<span class="chip pending" title="${esc(r.note || "")}">Not checked</span>` },
    ];
    const chk = (pg.marketing || {}).classification_check, m = chk ? chk.google_match : null;
    const gcheck = !m ? '<p class="na">Data unavailable: built with the Marketing page.</p>' : `<p><b>${esc(mFormat("percent", m.match_rate) ?? "n/a")}</b> of Google sessions with a campaign ID match a known campaign (${inGroup.format(m.matched)} of ${inGroup.format(m.with_campaign_id)}, ${esc(dayLabel(m.start))}–${esc(dayLabel(m.end))}); ${esc(mFormat("percent", m.no_id_share) ?? "n/a")} of Google sessions carry no campaign ID; ${inGroup.format(m.awareness)} sessions are on awareness IDs (${chk.google_awareness_ids} of ${chk.google_known_ids} known IDs).</p>
      ${chk.unclassified_google_ids.length ? table([{ label: "Unclassified Google ID", text: true, render: (r) => `${r.name ? esc(r.name) : '<span class="na">Name not found in Google Ads</span>'}<br><span class="sub">ID ${esc(r.campaign_id)}</span>` }, { key: "sessions", label: "Sessions", unit: "int" }, { label: "Last seen", render: (r) => esc(r.dates.at(-1)) }], chk.unclassified_google_ids) + '<p class="legend-note">Counted as performance until they sync; an alert fires for IDs seen yesterday.</p>' : '<p class="sub">No unclassified Google campaign IDs.</p>'}`;
    // products sold in the last 30 days that the product map does not know
    const pd = pg.product_days, unmapped = [];
    if (pd) {
      const last = pd.rows.length ? pd.rows[pd.rows.length - 1][0] : null, from = last ? new Date(Date.parse(last) - 29 * 864e5).toISOString().slice(0, 10) : null, sold = new Map();
      for (const r of pd.rows) if (r[0] >= from) sold.set(r[1], (sold.get(r[1]) || 0) + r[2]);
      for (const [i, u] of sold) if (u > 0 && !pmProduct(pd.names[i].id)) unmapped.push({ id: pd.names[i].id, label: pd.names[i].label, units: u });
    }
    const pmap = unmapped.length ? `<div class="ck"><span class="spill late"><i></i>${unmapped.length} product${unmapped.length === 1 ? "" : "s"} not in the product map</span><span class="why">They show as "Unmapped" on Products. Add each Shopify product ID to config.json → product_map.</span></div>`
      + table([{ label: "Product (as on the order line)", text: true, render: (r) => esc(r.label) }, { label: "Shopify product ID", text: true, render: (r) => `<code>${esc(r.id)}</code>` }, { key: "units", label: "Units, last 30 days", unit: "int" }], unmapped.sort((x, y) => y.units - x.units))
      : '<div class="ck"><span class="spill ok"><i></i>Every product sold in the last 30 days is in the product map</span></div>';
    // 3. sale calendar
    let cal = '<p class="na">Data unavailable: the day-by-day page is not built.</p>';
    const D = pg.days;
    if (D && D.dates) {
      const runs = [];
      D.dates.forEach((d, i) => { const ph = D.phase[i]; const last = runs[runs.length - 1]; if (last && last.ph === ph) { last.to = d; last.n++; } else runs.push({ ph, from: d, to: d, n: 1, note: D.phase_note ? D.phase_note[i] : null }); });
      const recent = runs.filter((r) => r.to >= D.dates[Math.max(0, D.dates.length - 75)]).reverse();
      const ov = Object.entries(state.config.phase_overrides || {});
      cal = table([{ label: "Days", text: true, render: (r) => esc(r.from === r.to ? dayLabel(r.from) : `${dayLabel(r.from)} – ${dayLabel(r.to)}`) }, { label: "Kind", text: true, render: (r) => phaseChip(r.ph, r.note) }, { key: "n", label: "Days", unit: "int" }], recent, { maxHeight: "40vh" })
        + `<p class="legend-note">Sale and BAU days come from hourly order detection and the team's sale calendar, which wins on every day it covers (source: ${esc(D.phase_source || "detection")}). ${ov.length ? `Overrides in config.json: ${ov.map(([d, v]) => `${d} → ${v}`).join(", ")}.` : "No overrides in config.json (phases.overrides)."}</p>`;
    }
    // 4. known exceptions
    const exc = [];
    for (const z of (pg.marketing || {}).zero_spend_days || []) exc.push({ day: z.date, what: `Google spend is zero: ${z.reason}` });
    for (const [f, days] of Object.entries((D && D.estimated) || {})) if (days && days.length) exc.push({ day: days[days.length - 1], what: `${f.replace(/_/g, " ")} is estimated for ${days.length} day${days.length === 1 ? "" : "s"} (${days.slice(-3).map(dayLabel).join(", ")}${days.length > 3 ? ", …" : ""}): the sheet is not filled yet` });
    const excHtml = exc.length ? table([{ label: "Day", text: true, render: (r) => esc(dayLabel(r.day)) }, { label: "Exception", text: true, render: (r) => esc(r.what) }], exc.sort((x, y) => (x.day < y.day ? 1 : -1))) : '<p class="sub">None.</p>';
    // 5. metric dictionary
    const TAB = Object.fromEntries(state.config.tabs.map((t) => [t.id, t.label]));
    const dict = table([
      { label: "Metric", text: true, render: (r) => `<strong>${esc(r.label)}</strong>` },
      { label: "Definition", text: true, render: (r) => esc(r.def) },
      { label: "Formula", text: true, render: (r) => esc(r.formula || "") },
      { label: "Source", text: true, render: (r) => esc(r.source || "") },
      { label: "Home tab", text: true, render: (r) => `<a href="#${esc(r.home)}">${esc(TAB[r.home] || r.home)}</a>` },
    ], Object.values(METRICS), { maxHeight: "60vh", full: true });
    // 6. methodology notes from every tab
    const NOTE_TABS = [["overview", "Overview"], ["funnel", "Funnel"], ["marketing", "Marketing"], ["products", "Products"], ["region", "Region"], ["d1", "D-1 Report"]];
    const method = NOTE_TABS.filter(([t]) => pg[t] && pg[t].notes && pg[t].notes.length).map(([t, l]) => `<h3>${esc(l)}</h3>${notes(pg[t])}`).join("") + `<h3>Data health</h3>${notes(p)}`;
    // 7. history
    const histCols = [
      { label: "Day", text: true, render: (r) => `<strong>${esc(dayLabel(r.day))}</strong>` },
      { label: "Complete (IST)", render: (r) => (r.complete ? esc(hhmm(r.completed_at) || "yes") : '<span class="cell-na" title="Not complete when last run">–</span>') },
      ...Object.entries(labels).map(([k, l]) => ({ label: l, render: (r) => esc(hhmm(r.arrived?.[k]) || "–") })),
    ];
    $main.innerHTML = `
      ${rgSec("Sources", `for D-1, ${esc(dayLabel(p.as_of))}${(state.config.build || {}).sha ? ` · code ${esc(state.config.build.sha)}${state.config.build.branch ? " (" + esc(state.config.build.branch) + ")" : ""}${state.config.build.at ? ", deployed " + esc(state.config.build.at.replace("T", " ")) : ""}` : ""}`, head + table(srcCols, p.sources, { full: true }) + `<h3>Other inputs</h3>` + inputs)}
      ${rgSec("Data checks", "our copy against each source, and the mappings the tabs rely on", `<h3>Cross-checks</h3>${p.reconcile?.length ? table(recCols, p.reconcile, { full: true }) : '<p class="na">No cross-check has run yet for this day.</p>'}<h3>Google sessions ↔ campaigns</h3>${gcheck}<h3>Product map</h3>${pmap}`)}
      ${rgSec("Meta classification", "tag coverage, names to fix, validation and the tie-out (Marketing › Meta)", mvHealth(pg.meta_ads, D), { comp: "meta-coverage" })}
      ${rgSec("Google classification", "tag coverage, the purchase split, validation and the tie-out (Marketing › Google)", gvHealth(pg.google_ads, D), { comp: "google-coverage" })}
      ${rgSec("Cooee (CRO tab)", "the sign-in, the last syncs, and Cooee's numbers against Shopify and GoKwik", croHealth(pg.cro, D), { comp: "cooee-health" })}
      ${pg.awareness ? rgSec("Awareness data", "geo coverage, the acceptance checks, unmapped city names and the job runs (Awareness tab)", awHealth(pg.awareness), { comp: "awareness-health" }) : ""}
      <div class="cols-2">
        ${rgSec("Sale calendar", "which days are BAU and which are sale", cal)}
        ${rgSec("Known exceptions", "days whose numbers need a footnote", excHtml)}
      </div>

      ${rgFold("Methodology", "how each tab's numbers are built", `<div class="method">${method}</div>`)}
      ${rgFold("Arrival history", "when each source first had the day, last 8 days", table(histCols, p.history || []))}`;
  };

  /*__RETENTION_UI__*/

  // ------------------------------------------------------------ live (Today)
  const LIVE = { base: "typical", metric: "gmv", view: "run", pop: false,
    date: (() => { try { return localStorage.getItem("asaya-live-date") || null; } catch (e) { return null; } })() };
  if (LIVE.date) LIVE.base = "past"; // a picked date stays picked on this device until cleared
  const liveSaveDate = () => { try { if (LIVE.date) localStorage.setItem("asaya-live-date", LIVE.date); else localStorage.removeItem("asaya-live-date"); } catch (e) { /* storage blocked */ } };
  /* "Compare with a date": today against any earlier day (the last run of an
     offer, a matching BAU day), from pages/live_history.json: the cards at
     the same clock time, the chart and the hour-by-hour table across that
     whole day. The same maths as the server's typical day. */
  const liveT = (p) => { const [h, m] = new Date(p.generated_at).toLocaleString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Kolkata" }).split(":").map(Number); return (h % 24) + m / 60; };
  const liveCum = (a, t) => { if (t >= 24) return a.reduce((x, y) => x + y, 0); const h = Math.floor(t); let r = 0; for (let i = 0; i < h; i++) r += a[i]; return r + (t - h) * a[h]; };
  const liveSnapAt = (snaps, t) => { let best = null; for (const [h, v] of snaps || []) if (h <= t + 0.02 && t - h <= 0.6 && (!best || h > best[0])) best = [h, v]; return best ? best[1] : null; };
  const LIVE_IX = { orders: 0, gmv: 1, sessions: 2, atc: 3 };
  function liveDayAt(H, d, t) { // one past day read at time t (t >= 24: the whole day)
    const a = H && H.days[d];
    if (!a) return null;
    const m = { orders: liveCum(a[0], t), gmv: liveCum(a[1], t), sessions: liveCum(a[2], t), atc: liveCum(a[3], t) };
    const perf = t < 24 ? liveSnapAt((H.perf || {})[d], t) : null;
    return { ...m, aov: m.orders ? m.gmv / m.orders : null, cvr: m.sessions ? m.orders / m.sessions : null, cvr_perf: perf ? m.orders / perf : null };
  }
  const liveDay = (d, y) => new Date(d + "T00:00:00Z").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", ...(y ? { year: "numeric" } : {}), timeZone: "UTC" });
  /* the date button's calendar: one month, sale days shaded as on the other tabs */
  function livePop(H) {
    if (!H) return `<div class="rg-pop live-pop"><p class="rg-hint pad">${esc(LIVE.hErr ? "Past days could not be loaded: " + LIVE.hErr : "Loading past days…")}</p></div>`;
    const all = Object.keys(H.days).sort(), first = all[0], last = H.as_of;
    if (!LIVE.view2) { const v = LIVE.date || last; LIVE.view2 = [+v.slice(0, 4), +v.slice(5, 7) - 1]; }
    const [y, m] = LIVE.view2, pad = new Date(Date.UTC(y, m, 1)).getUTCDay(), n = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    let cells = "";
    for (let i = 0; i < pad; i++) cells += "<span></span>";
    for (let day = 1; day <= n; day++) {
      const d = `${y}-${String(m + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`, ok = !!H.days[d], sale = (H.phases || {})[d] === "sale";
      cells += `<button type="button" class="rg-day${d === LIVE.date ? " edge" : ""}${!ok ? " off" : ""}${sale ? " sale" : ""}" data-ld="${d}" ${ok ? "" : "disabled"} aria-label="${esc(liveDay(d, true))}${sale ? ", sale day" : ""}">${day}</button>`;
    }
    const canPrev = first && `${y}-${String(m + 1).padStart(2, "0")}` > first.slice(0, 7), canNext = `${y}-${String(m + 1).padStart(2, "0")}` < last.slice(0, 7);
    return `<div class="rg-pop live-pop" role="dialog" aria-label="Compare today with a date">
      <div class="rg-right">
        <div class="rg-inputs"><input type="date" id="lp-in" value="${LIVE.date || ""}" min="${first || ""}" max="${last}" aria-label="Date"></div>
        <div class="rg-nav" style="align-items:center"><button type="button" id="lp-prev" aria-label="Earlier month" ${canPrev ? "" : "disabled"}>‹</button><span class="rg-mname" style="margin:0">${rgMonthName(y, m)}</span><button type="button" id="lp-next" aria-label="Later month" ${canNext ? "" : "disabled"}>›</button></div>
        <div><div class="rg-month"><div class="rg-dow">${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((x) => `<span>${x}</span>`).join("")}</div><div class="rg-grid">${cells}</div></div></div>
        <p class="rg-hint rg-legend"><span><i class="rg-sw sale"></i>sale day</span>${H.pending_days ? `<span>${H.pending_days} older days still loading</span>` : ""}</p>
      </div>
      ${LIVE.date ? '<div class="rg-foot"><button type="button" class="rg-btn" id="lp-clear">Clear date</button></div>' : ""}
    </div>`;
  }
  function liveLoadHistory(p) {
    if (state.pages.live_history || LIVE.hLoading) return;
    LIVE.hLoading = true;
    loadPage("live_history").then(() => { LIVE.hErr = null; }).catch((e) => { LIVE.hErr = e.message || String(e); })
      .finally(() => { LIVE.hLoading = false; if (state.tab === "live") { destroyCharts(); R.live(p); } });
  }
  /* hour by hour, as Shopify shows a day: today and the comparison in each hour, with the so-far and full-day totals */
  function liveHours(today, cmp, t, cmpLabel) {
    const per = (c) => (c ? c.map((v, h) => (v == null ? null : h ? v - (c[h - 1] ?? 0) : v)) : null);
    const T = { gmv: per(today.gmv), orders: per(today.orders), sessions: per(today.sessions) }, C = { gmv: per(cmp.gmv), orders: per(cmp.orders), sessions: per(cmp.sessions) };
    const hNow = Math.min(23, Math.floor(t)), frac = Math.min(1, t - hNow), mins = Math.round(frac * 60);
    const lbl = (h) => `${h % 12 || 12} ${h < 12 ? "am" : "pm"}`;
    // the hour under way is set against the same minutes of the comparison's hour, as the cards are
    const cAt = (k, h) => (C[k] && C[k][h] != null ? C[k][h] * (h === hNow ? frac : 1) : null);
    const pick = (f) => ({ gmv: f("gmv"), orders: f("orders"), sessions: f("sessions") });
    const rows = Array.from({ length: 24 }, (_, h) => ({ h, label: lbl(h) + (h === hNow ? ` (first ${mins} min)` : ""),
      t: h <= hNow ? pick((k) => T[k] && T[k][h]) : null, c: pick((k) => cAt(k, h)) }));
    const sumC = (k, upto) => (C[k] ? Array.from({ length: upto + 1 }, (_, h) => cAt(k, h) || 0).reduce((a, v) => a + v, 0) : null);
    const sumT = (k, upto) => (T[k] ? T[k].slice(0, upto + 1).reduce((a, v) => a + (v || 0), 0) : null);
    const full = (k) => (C[k] ? C[k].reduce((a, v) => a + (v || 0), 0) : null);
    rows.push({ label: `So far (to ${new Date(Date.UTC(2000, 0, 1, hNow, mins)).toLocaleTimeString("en-GB", { hour: "numeric", minute: "2-digit", hour12: true, timeZone: "UTC" })})`, t: pick((k) => sumT(k, hNow)), c: pick((k) => sumC(k, hNow)), _class: "total" });
    rows.push({ label: "Full day", t: null, c: pick(full), _class: "total" });
    const pair = (k, unit, l) => [
      { label: `${l} today`, render: (r) => (r.t && r.t[k] != null ? esc(fmt(r.t[k], unit)) : '<span class="na">–</span>') },
      { label: `${l} ${cmpLabel}`, render: (r) => (r.c[k] != null ? esc(fmt(r.c[k], unit)) : '<span class="na">–</span>') + (r.t && r.t[k] != null && r.c[k] ? ` <span class="sub">${deltaHtml(r.t[k] / r.c[k] - 1, "count")}</span>` : "") },
    ];
    return table([{ label: "Hour", text: true, render: (r) => esc(r.label) }, ...pair("gmv", "inr", "Sales"), ...pair("orders", "int", "Orders"), ...pair("sessions", "int", "Sessions")], rows, { full: true, maxHeight: "60vh" });
  }
  function liveBindDate(p) {
    const box = document.querySelector(".live-date");
    if (!box) return;
    const redraw = () => { destroyCharts(); R.live(p); };
    // open toward the side with room (the button sits left or right depending on the width)
    const pop = box.querySelector(".live-pop");
    if (pop && innerWidth > 720 && box.getBoundingClientRect().left + pop.offsetWidth > innerWidth - 8) { pop.style.left = "auto"; pop.style.right = "0"; }
    box.addEventListener("click", (ev) => {
      const t = ev.target;
      if (t.closest("#lp-open")) { LIVE.pop = !LIVE.pop; if (LIVE.pop) LIVE.view2 = null; return redraw(); }
      const day = t.closest("[data-ld]");
      if (day) { LIVE.date = day.dataset.ld; LIVE.base = "past"; LIVE.pop = false; liveSaveDate(); return redraw(); }
      if (t.closest("#lp-prev")) { const [y, m] = LIVE.view2; LIVE.view2 = m === 0 ? [y - 1, 11] : [y, m - 1]; return redraw(); }
      if (t.closest("#lp-next")) { const [y, m] = LIVE.view2; LIVE.view2 = m === 11 ? [y + 1, 0] : [y, m + 1]; return redraw(); }
      if (t.closest("#lp-clear")) { LIVE.date = null; LIVE.base = "typical"; LIVE.pop = false; liveSaveDate(); return redraw(); }
    });
    box.querySelector("#lp-in")?.addEventListener("change", (ev) => {
      const v = ev.target.value, H = state.pages.live_history;
      if (v && H && H.days[v]) { LIVE.date = v; LIVE.base = "past"; LIVE.pop = false; liveSaveDate(); redraw(); }
      else if (v) { ev.target.setCustomValidity("That day is not loaded"); ev.target.reportValidity(); }
    });
  }
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && LIVE.pop && state.tab === "live") { LIVE.pop = false; destroyCharts(); R.live(state.pages.live); } });
  document.addEventListener("click", (ev) => { if (LIVE.pop && state.tab === "live" && !ev.target.closest(".live-date")) { LIVE.pop = false; destroyCharts(); R.live(state.pages.live); } });
  const liveAge = (p) => Math.max(0, Math.round((Date.now() - new Date(p.generated_at).getTime()) / 60000));
  const liveWhen = (iso) => new Date(iso).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit", hour12: true });
  function liveTick() {
    const p = state.pages.live, el = document.getElementById("live-age");
    if (!p || !el) return;
    const a = liveAge(p);
    el.textContent = a < 1 ? "just now" : a + " min ago";
    const warn = document.getElementById("live-stale");
    if (warn) warn.hidden = a < 30;
  }
  async function liveRefresh() {
    if (state.tab !== "live" || document.hidden || embedded) return;
    try {
      const page = await getJSON("/api/page/live");
      if (page && page.generated_at !== state.pages.live?.generated_at) {
        state.pages.live = page; destroyCharts(); R.live(page); renderMeta(page);
      }
    } catch (e) { /* keep showing the last good view; the age label says how old it is */ }
  }
  /* Today: "Are we on pace right now?" Always live (no date picker): six
     numbers so far today against a typical same-weekday day of the same kind
     at the same time (or yesterday at the same time), the running total
     through the day, spend pacing, the campaigns, and the checkout. */
  const LIVE_KPI = [["orders", "orders"], ["gmv", "total_sales"], ["aov", "aov"], ["total_spend", "perf_spend"], ["roas", "blended_roas"], ["cvr", "cvr"], ["cvr_perf", "perf_cvr"]];
  R.live = (p) => {
    clearInterval(state.liveTimer); clearInterval(state.liveTick);
    state.liveTimer = setInterval(liveRefresh, (p.refresh_seconds || 180) * 1000);
    state.liveTick = setInterval(liveTick, 20000);
    const sh = p.shopify, sc = p.scorecard;
    const items = new Map(); for (const gr of (sc ? sc.groups : [])) for (const it of gr.items) items.set(it.key, it);
    const H = state.pages.live_history;
    if ((LIVE.base === "past" || LIVE.pop) && !H) liveLoadHistory(p);
    const past = LIVE.base === "past" && !!LIVE.date, typ = LIVE.base === "typical" || (LIVE.base === "past" && !LIVE.date);
    const t = liveT(p), P = past ? liveDayAt(H, LIVE.date, t) : null, PF = past ? liveDayAt(H, LIVE.date, 24) : null;
    const dLabel = LIVE.date ? liveDay(LIVE.date) : "";
    const baseLabel = sh ? (past ? dLabel : typ ? sh.typical_label : sh.yesterday_label) : "";
    // the second header row: live, how fresh, what today is compared with
    setSub(`<div class="sub-line"><span class="live-dot" aria-hidden="true"></span><b>Live · ${esc(p.weekday)} ${esc(dayLabel(p.today))}</b><span class="rg-dim">updated <span id="live-age"></span> · refreshes every ${Math.round((p.refresh_seconds || 180) / 60)} min</span>
      ${sh ? `<span class="rg-dim">compared with</span><div class="seg" id="live-base" role="group" aria-label="Compare today with"><button type="button" data-b="typical" aria-pressed="${typ}">${esc(sh.typical_label)}</button><button type="button" data-b="yesterday" aria-pressed="${LIVE.base === "yesterday"}">Yesterday, same time</button></div>
      <span class="live-date" style="position:relative"><button type="button" class="rg-chip${past ? "" : " alt"}" id="lp-open" aria-haspopup="dialog" aria-expanded="${LIVE.pop}" aria-pressed="${past}"><span aria-hidden="true">▦</span> ${esc(LIVE.date ? liveDay(LIVE.date, true) : "Compare with a date")} <span aria-hidden="true" class="rg-caret">▾</span></button>${LIVE.pop ? livePop(H) : ""}</span>` : ""}</div>`);
    const kpi = ([key, id]) => {
      const it = items.get(key);
      if (!it) return kpiCard(id, { value: null, na: (p.unavailable && p.unavailable.shopify_orders) || "not available yet" });
      if (it.value == null) return kpiCard(id, { value: null, na: it.na });
      if (key === "total_spend") return kpiCard(id, { value: it.value, est: it.estimate ? "Includes estimated Reddit, CRM and affiliate spend: the sheets are filled the next day" : "", sub: it.ref && it.ref.share != null ? `${Math.round(it.ref.share * 100)}% ${it.ref.label} (${mVal(id, it.ref.value, true)})` : "" });
      if (key === "roas") return kpiCard(id, { value: it.value, prev: it.ref ? it.ref.value ?? null : null, change: it.ref && it.ref.value ? it.value / it.ref.value - 1 : null, tipExtra: it.ref ? `Compared with ${it.ref.label}.` : "", est: "Built on estimated Reddit, CRM and affiliate spend" });
      if (past) {
        const v = P ? P[key] : null, full = PF ? PF[key] : null;
        return kpiCard(id, { value: it.value, prev: v ?? null, change: v ? it.value / v - 1 : null,
          tipExtra: P ? `Compared with ${liveDay(LIVE.date, true)} up to the same time of day.` : `${liveDay(LIVE.date, true)} is not loaded yet.`,
          sub: full != null ? `${dLabel} full day: ${mVal(id, full, true)}` : "",
          small: id !== "cvr" && id !== "perf_cvr" && v != null && (P.orders || 0) < METRIC_RULES.min_orders });
      }
      const v = typ ? it.typical : it.yesterday, d = typ ? it.vs_typical : it.vs_yesterday;
      return kpiCard(id, { value: it.value, prev: v ?? null, change: d, small: id !== "cvr" && id !== "perf_cvr" && v != null && (items.get("orders")[typ ? "typical" : "yesterday"] || 0) < METRIC_RULES.min_orders });
    };
    const strip = `<section class="card"><div class="kpis seven">${LIVE_KPI.map(kpi).join("")}</div><div class="banner" id="live-stale" hidden>This view is more than 30 minutes old, so the live refresh may be failing. The numbers are the last good ones.</div></section>`;
    // the comparison's running totals: a picked date from the history, else the server's typical day or yesterday
    const cmpCurves = !sh ? null : past ? (H && H.days[LIVE.date] ? Object.fromEntries(["gmv", "orders", "sessions"].map((k) => { let r = 0; return [k, H.days[LIVE.date][LIVE_IX[k]].map((v) => (r += v))]; })) : null)
      : Object.fromEntries(["gmv", "orders", "sessions"].map((k) => [k, sh.curves.series[k][typ ? "typical" : "yesterday"]]));
    const todayCurves = sh ? Object.fromEntries(["gmv", "orders", "sessions"].map((k) => [k, sh.curves.series[k].today])) : null;
    const chart = sh ? rgSec("Through the day", LIVE.view === "hour" ? "each hour, today against the comparison" : "running total, today against the comparison", `${legend([["--accent", "Today"], ["--muted", baseLabel + " (dashed)"]])}<div class="chart-box"><canvas id="c-live" aria-label="Today through the day"></canvas></div>`,
      { ctl: `<div class="seg" id="live-view">${[["run", "Running total"], ["hour", "By hour"]].map(([k, l]) => `<button type="button" data-v="${k}" aria-pressed="${LIVE.view === k}">${l}</button>`).join("")}</div><div class="seg" id="live-metric">${[["gmv", "Total sales"], ["orders", "Orders"], ["sessions", "Sessions"]].map(([k, l]) => `<button type="button" data-m="${k}" aria-pressed="${LIVE.metric === k}">${l}</button>`).join("")}</div>` }) : "";
    const hours = sh && cmpCurves ? rgFold("Hour by hour", `today against ${esc(baseLabel)}, as Shopify shows a day`, liveHours(todayCurves, cmpCurves, t, past ? dLabel : typ ? "typical" : "yesterday"), { open: past, comp: "live-hours" }) : "";
    // spend pacing: sales campaigns against yesterday's full day; the campaign view acts here
    const pace = ["meta_spend", "google_spend", "reddit_spend", "crm_aff_spend"].map((k) => items.get(k)).filter(Boolean).map((it) => kpiCard("channel_spend", {
      label: it.label === "Meta spends" ? "Meta" : it.label, value: it.value, na: it.na, est: it.estimate ? it.note || "estimated" : "",
      sub: it.ref && it.ref.share != null ? `${Math.round(it.ref.share * 100)}% ${it.ref.label} (${mVal("channel_spend", it.ref.value, true)})` : "" })).join("");
    const V = (p.views && p.views[RG.scope]) || {};
    const sb = V.spend_breakdown || [];
    const breakdown = RG.scope === "perf" ? `<div class="kpis">${pace}</div>` : sb.length ? table([
      { label: "Channel", text: true, render: (r) => esc(r.label) },
      { label: "So far today", render: (r) => (r.value == null ? `<span class="cell-na" title="Data unavailable: ${esc(r.note)}">n/a</span>` : esc(fmt(r.value, "inr")) + (r.kind === "estimate" && r.label !== "All channels" ? ' <span class="chip pending">est.</span>' : "")) },
    ], sb.map((r) => ({ ...r, _class: r.label === "All channels" ? "total" : r.level ? "live-subrow" : "" }))) : '<p class="na">No spend reported yet today.</p>';
    const spend = rgSec("Spend today", RG.scope === "perf" ? "sales campaigns, as a share of yesterday's full day" : "by platform and campaign type", breakdown, { ctl: rgScopeSeg("live-scope") });
    // campaigns: sorted by spend; a big spend with no platform value late in the day is flagged
    const F = state.config.live_flag || {}, minS = F.min_spend ?? 3000, after = F.after_hour ?? 14;
    const hourNow = +new Date(p.generated_at).toLocaleString("en-GB", { hour: "2-digit", hour12: false, timeZone: "Asia/Kolkata" });
    const adTable = (title, blk) => {
      if (blk.na && !blk.today) return rgSec(title, "", `<p class="na">Source late: ${esc(blk.na)}</p>`);
      const rows = blk.campaigns.filter((c) => rgKeep(c.kind || c.awareness, RG.scope)).sort((x, y) => (y.spend || 0) - (x.spend || 0));
      const flagged = (r) => hourNow >= after && (r.spend || 0) >= minS && !r.value && !r.awareness && r.kind !== "social";
      const n = rows.filter(flagged).length;
      return rgSec(title, n ? `${n} campaign${n === 1 ? "" : "s"} with spend and no return yet` : "sorted by spend", table([
        { label: "Campaign", text: true, render: (r) => `<span class="trunc" title="${esc(r.campaign)}">${esc(r.campaign)}</span>${r.awareness ? ' <span class="sub">Awareness</span>' : r.kind === "social" ? ' <span class="sub">Reach</span>' : ""}${flagged(r) ? ` <span class="chip pending" title="Spent ₹${inGroup.format(minS)} or more with no platform value after ${after}:00. Platforms attribute late: a watch flag, not a verdict.">⚑ no return yet</span>` : ""}` },
        { label: "Spend", render: (r) => esc(fmt(r.spend, "inr") ?? "n/a") },
        { label: mHead("platform_revenue", "Platform value"), render: (r) => esc(fmt(r.value, "inr") ?? "n/a") },
        ...(RG.scope === "aw" ? [] : [{ label: mHead("platform_roas"), render: (r) => (r.roas === null ? '<span class="na">–</span>' : esc(fmt(r.roas, "x"))) }]),
      ], rows, { maxHeight: "50vh", full: true }));
    };
    const gk = p.gokwik;
    const checkout = gk.na
      ? rgSec("Checkout (GoKwik)", "", `<div class="ck"><span class="spill late"><i></i>Source late${gk.as_of ? " · last loaded " + esc(liveWhen(gk.as_of)) : ""}</span><span class="why">${esc(gk.na)}</span></div>`)
      : rgSec("Checkout (GoKwik)", `as loaded ${gk.age_minutes == null ? "" : gk.age_minutes + " min ago"} · against the last ${gk.typical_days} days`, `${gk.stale ? `<div class="ck"><span class="spill late"><i></i>Source late</span><span class="why">The latest GoKwik load is old, so these rates are not current.</span></div>` : ""}
        ${table([
          { label: "Step", text: true, render: (r) => esc(r.label) },
          { label: "Customers", render: (r) => esc(fmt(r.count, "int") ?? "n/a") },
          { label: "Step rate", render: (r) => (r.rate === null ? '<span class="na">–</span>' : esc(mFormat("percent", r.rate))) },
          { label: "Typical", render: (r) => (r.typical === null ? '<span class="na">–</span>' : esc(mFormat("percent", r.typical))) },
          { label: "vs typical", render: (r) => (r.delta === null ? '<span class="flat">–</span>' : deltaHtml(r.delta, "rate")) },
        ], gk.steps)}`);
    $main.innerHTML = strip + chart + hours + spend + `<div class="cols-2">${adTable("Meta campaigns today", p.meta)}${adTable("Google Ads campaigns today", p.google)}</div>` + checkout;
    liveTick();
    liveBindDate(p);
    rgScopeBind("live-scope");
    document.getElementById("live-base")?.addEventListener("click", (ev) => { const b = ev.target.closest("button[data-b]"); if (b) { LIVE.base = b.dataset.b; LIVE.pop = false; destroyCharts(); R.live(p); } });
    document.getElementById("live-view")?.addEventListener("click", (ev) => { const b = ev.target.closest("button[data-v]"); if (b) { LIVE.view = b.dataset.v; destroyCharts(); R.live(p); } });
    document.getElementById("live-metric")?.addEventListener("click", (ev) => { const b = ev.target.closest("button[data-m]"); if (b) { LIVE.metric = b.dataset.m; destroyCharts(); R.live(p); } });
    const canvas = document.getElementById("c-live");
    if (canvas && sh) {
      const unit = LIVE.metric === "gmv" ? "inr" : "int", hourly = LIVE.view === "hour";
      const per = (c) => (c ? c.map((v, h) => (v == null ? null : h ? v - (c[h - 1] ?? 0) : v)) : []);
      const tod = todayCurves[LIVE.metric], cmp = cmpCurves ? cmpCurves[LIVE.metric] : null;
      const labels = sh.curves.hours.map((h) => (h % 12 || 12) + (h < 12 ? "a" : "p"));
      baseChart(canvas, { type: "line", data: { labels, datasets: [
        { label: baseLabel, data: (hourly ? per(cmp) : cmp) || [], borderColor: css("--muted"), borderDash: [5, 4], borderWidth: 2, pointRadius: 0, tension: 0.25 },
        { label: "Today", data: hourly ? per(tod) : tod, borderColor: css("--accent"), backgroundColor: css("--accent"), borderWidth: 2.5, pointRadius: hourly ? 2 : 0, tension: 0.25, spanGaps: false },
      ] } }, unit);
    }
  };

  // ------------------------------------------------------------ routing
  async function show() {
    const ids = state.config.tabs.map((t) => t.id);
    const ALIAS = { daily: "funnel" }; // old links keep working
    const raw = location.hash.slice(1).split("?")[0];
    if (ALIAS[raw]) { history.replaceState(null, "", "#" + ALIAS[raw]); }
    const want = location.hash.slice(1).split("?")[0]; // "#marketing?sub=meta&…": the tab, then its own state
    state.tab = ids.includes(want) ? want : ids[0];
    renderTabs();
    destroyCharts();
    clearInterval(state.liveTimer); clearInterval(state.liveTick);
    $main.innerHTML = '<p class="empty">Loading…</p>';
    setSub("");
    document.getElementById("mv-drawer")?.remove(); document.getElementById("gv-drawer")?.remove(); document.getElementById("aw-drawer")?.remove(); document.body.classList.remove("mv-dr-open");
    try {
      const page = await loadPage(state.tab);
      if (!page) throw new Error("This tab has not been built yet.");
      renderMeta(page);
      R[state.tab](page);
      try { localStorage.setItem("asaya-dash-tab", state.tab); } catch (e) { /* storage blocked */ }
    } catch (e) {
      if (e.auth) return signIn(e.message);
      $main.innerHTML = `<section class="card"><h2>Couldn't load this tab</h2><p>${esc(e.message)}</p></section>`;
    }
  }

  function signIn(message) {
    // a failed redirect sign-in comes back as ?signin_error=...
    const qe = new URLSearchParams(location.search).get("signin_error");
    if (qe) { message = qe; history.replaceState(null, "", location.pathname + location.hash); }
    $main.innerHTML = `<div class="signin"><h2>Sign in to the Asaya dashboard</h2>
      <p class="sub">${esc(message && message !== "Sign in required" ? message : "Use your Google account. Access is limited to the people on the dashboard allowlist.")}</p>
      <div id="gsi"></div><p class="sub" style="margin-top:12px">On a phone, if sign-in will not open, open this page in Safari or Chrome.</p></div>`;
    // Phones and in-app browsers (opened from WhatsApp, Slack, the Claude app...)
    // break Google's pop-up and its redirect mode, so there sign-in is a plain
    // link to Google's own sign-in page, which posts back to this site.
    const phone = /Android|iPhone|iPad|iPod|Mobile|FBAN|FBAV|Instagram|Line\/|; wv\)|WhatsApp|Slack|CriOS|FxiOS/i.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPad asking for the desktop site
    if (phone) {
      document.getElementById("gsi").innerHTML = `<a class="gsi-link" href="/auth/google/start" style="display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border:1px solid #dadce0;border-radius:999px;background:#fff;color:#3c4043;font:500 15px/1.2 system-ui,sans-serif;text-decoration:none"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.8 6C12.2 13.6 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C.9 16.6 0 20.2 0 24s.9 7.4 2.6 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.8-5.8l-7.4-5.7c-2.1 1.4-4.8 2.2-8.4 2.2-6.4 0-11.8-4.1-13.7-9.8l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>Sign in with Google</a>`;
      return;
    }
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.onload = () => {
      google.accounts.id.initialize({
        client_id: state.config.google_client_id,
        callback: async (resp) => {
          const r = await fetch("/auth/google", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ credential: resp.credential }) });
          if (r.ok) { state.pages = {}; boot(); } else { signIn((await r.json().catch(() => ({}))).detail || "Sign-in failed"); }
        },
      });
      google.accounts.id.renderButton(document.getElementById("gsi"), { theme: "outline", size: "large", shape: "pill" });
    };
    document.head.appendChild(s);
  }

  async function boot() {
    try {
      if (embedded) {
        state.config = embedded.config; state.status = embedded.status;
      } else {
        state.config = await getJSON("/api/config");
        if (!state.config.dev_mode) await getJSON("/api/me");
        state.status = await getJSON("/api/status").catch(() => null);
      }
    } catch (e) {
      if (e.auth) return signIn(e.message);
      $main.innerHTML = `<section class="card"><h2>The dashboard is not reachable</h2><p>${esc(e.message)}</p></section>`;
      return;
    }
    Object.assign(METRIC_RULES, state.config.display || {});
    askMount();
    if (!location.hash) { try { const t = localStorage.getItem("asaya-dash-tab"); if (t) history.replaceState(null, "", "#" + t); } catch (e) { /* storage blocked */ } }
    show();
  }

  // the date bar pins itself just under the header, whatever height the header wraps to
  const headerEl = document.querySelector(".bar");
  if (headerEl) {
    const setBarH = () => document.documentElement.style.setProperty("--bar-h", headerEl.getBoundingClientRect().height + "px");
    setBarH();
    if (window.ResizeObserver) new ResizeObserver(setBarH).observe(headerEl);
  }
  window.addEventListener("hashchange", show);
  const rerender = () => { if (state.tab && state.pages[state.tab]) { destroyCharts(); R[state.tab](state.pages[state.tab]); } };
  const themeBtn = document.getElementById("theme-toggle");
  const paintToggle = () => {
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    themeBtn.setAttribute("aria-pressed", String(dark));
    themeBtn.innerHTML = dark ? "<span aria-hidden=\"true\">☀</span> <span class=\"tt\">Light</span>" : "<span aria-hidden=\"true\">☾</span> <span class=\"tt\">Dark</span>";
    themeBtn.title = dark ? "Switch to the light theme" : "Switch to the dark theme";
  };
  themeBtn.addEventListener("click", () => {
    const dark = document.documentElement.getAttribute("data-theme") !== "dark";
    if (dark) document.documentElement.setAttribute("data-theme", "dark"); else document.documentElement.removeAttribute("data-theme");
    try { localStorage.setItem("asaya-theme", dark ? "dark" : "light"); } catch (e) { /* storage blocked */ }
    paintToggle();
  });
  paintToggle();
  new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  boot();
})();
</script>
